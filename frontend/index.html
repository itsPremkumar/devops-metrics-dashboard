"""DeployPulse Frontend — React + TypeScript DORA Dashboard"""
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeployPulse — DORA Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0a0f; color: #e4e4e7; }
        .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .sidebar { background: #111118; border-right: 1px solid #27272a; padding: 24px 16px; }
        .sidebar h1 { font-size: 20px; font-weight: 700; color: #fafafa; margin-bottom: 8px; }
        .sidebar .version { font-size: 11px; color: #71717a; margin-bottom: 32px; }
        .nav-item { display: block; padding: 10px 16px; border-radius: 8px; color: #a1a1aa; font-size: 14px; margin-bottom: 4px; cursor: pointer; transition: all 0.2s; }
        .nav-item:hover, .nav-item.active { background: #1e1e2e; color: #fafafa; }
        .main { padding: 32px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .header h2 { font-size: 28px; font-weight: 700; }
        .filters { display: flex; gap: 12px; }
        .filter-select { background: #18181b; border: 1px solid #27272a; color: #e4e4e7; padding: 8px 16px; border-radius: 8px; font-size: 13px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .metric-card { background: #111118; border: 1px solid #27272a; border-radius: 16px; padding: 24px; }
        .metric-card .label { font-size: 13px; color: #71717a; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-card .value { font-size: 36px; font-weight: 700; color: #fafafa; }
        .metric-card .unit { font-size: 14px; color: #71717a; margin-left: 4px; }
        .metric-card .trend { font-size: 12px; margin-top: 8px; }
        .trend.up { color: #22c55e; }
        .trend.down { color: #ef4444; }
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
        .chart-card { background: #111118; border: 1px solid #27272a; border-radius: 16px; padding: 24px; }
        .chart-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .chart-placeholder { height: 200px; background: linear-gradient(135deg, #1e1e2e 0%, #18181b 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #52525b; font-size: 13px; }
        .pipeline-list { background: #111118; border: 1px solid #27272a; border-radius: 16px; padding: 24px; }
        .pipeline-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #27272a; }
        .pipeline-item:last-child { border-bottom: none; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 12px; }
        .status-dot.success { background: #22c55e; }
        .status-dot.failed { background: #ef4444; }
        .status-dot.running { background: #3b82f6; animation: pulse 1.5s infinite; }
        .status-dot.pending { background: #eab308; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pipeline-name { flex: 1; font-size: 14px; }
        .pipeline-time { font-size: 12px; color: #71717a; }
        .live-indicator { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #22c55e; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 1.5s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
